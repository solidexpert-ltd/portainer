name: Build Docker image

on:
  push:
    branches: [develop, main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: solidexpert/portainer-ce
  DOCKERFILE: build/linux/Dockerfile

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAGS=(
            "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
            "${IMAGE_NAME}:${VERSION}"
            "${IMAGE_NAME}:${VERSION}-${SHORT_SHA}"
            "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == "develop" || "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            TAGS+=("${IMAGE_NAME}:latest")
          fi
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Portainer binaries and UI
        env:
          ENV: production
          PLATFORM: linux
          ARCH: amd64
          BUILDNUMBER: ${{ github.run_number }}
          CONTAINER_IMAGE_TAG: ${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          SKIP_GO_GET: "true"
        run: |
          make tidy
          make build-server PLATFORM=linux ARCH=amd64
          make build-client ENV=production
          # Dockerfile copies dist/storybook*; keep a placeholder when Storybook is skipped.
          mkdir -p dist/storybook
          printf '%s\n' 'placeholder' > dist/storybook/.keep

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
