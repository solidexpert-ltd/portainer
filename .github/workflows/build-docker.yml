name: Build Docker image

on:
  push:
    branches: [develop, main, master]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: solidexpert/portainer-ce
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/portainer-ce
  DOCKERFILE: build/linux/Dockerfile
  OVERLAY_DOCKERFILE: build/without-annoying/Dockerfile

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install pnpm dependencies
        # Upstream lockfile can disagree with CI pnpm plugin checksums; allow refresh.
        run: pnpm install --no-frozen-lockfile

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -n "${DOCKERHUB_USER}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets missing; publishing to GHCR only."
          fi

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/portainer-ce"

          TAGS=(
            "${GHCR_IMAGE}:${GITHUB_RUN_NUMBER}"
            "${GHCR_IMAGE}:${VERSION}"
            "${GHCR_IMAGE}:${VERSION}-${SHORT_SHA}"
            "${GHCR_IMAGE}:${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == "develop" || "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            TAGS+=("${GHCR_IMAGE}:latest")
          fi

          if [[ "${{ steps.dockerhub.outputs.enabled }}" == "true" ]]; then
            TAGS+=(
              "${DOCKERHUB_IMAGE}:${GITHUB_RUN_NUMBER}"
              "${DOCKERHUB_IMAGE}:${VERSION}"
              "${DOCKERHUB_IMAGE}:${VERSION}-${SHORT_SHA}"
              "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}"
            )
            if [[ "${GITHUB_REF_NAME}" == "develop" || "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
              TAGS+=("${DOCKERHUB_IMAGE}:latest")
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "ghcr_image=${GHCR_IMAGE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Portainer binaries and UI
        env:
          ENV: production
          PLATFORM: linux
          ARCH: amd64
          BUILDNUMBER: ${{ github.run_number }}
          CONTAINER_IMAGE_TAG: ${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          SKIP_GO_GET: "true"
        run: |
          make tidy
          make build-server PLATFORM=linux ARCH=amd64
          make build-client ENV=production
          # Dockerfile copies dist/storybook*; keep a placeholder when Storybook is skipped.
          mkdir -p dist/storybook
          printf '%s\n' 'placeholder' > dist/storybook/.keep

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      # Classic docker build so the overlay can FROM the local base tag.
      - name: Build CE base + without-annoying overlay and push
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: |
          set -euo pipefail
          docker build \
            -f "${DOCKERFILE}" \
            --build-arg "GIT_COMMIT=${SHORT_SHA}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            -t portainer-ce-base:local \
            .

          docker build \
            -f "${OVERLAY_DOCKERFILE}" \
            --build-arg BASE_IMAGE=portainer-ce-base:local \
            -t portainer-ce-overlay:local \
            build/without-annoying

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            docker tag portainer-ce-overlay:local "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"
