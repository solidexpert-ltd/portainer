<div class="page-wrapper dc-auth-page">
  <div class="dc-auth-shell">
    <!-- Left: credentials (account.1crm.io light chrome) -->
    <div class="dc-auth-panel">
      <div class="dc-auth-panel-inner">
        <img
          class="dc-auth-logo"
          src="~@/assets/images/logo/logo-text.svg"
          width="184"
          height="58"
          alt="1CRM"
        />

        <h1 class="dc-auth-title">Developer Console</h1>
        <p class="dc-auth-subtitle">Sign in with your 1CRM account</p>

        <div class="dc-auth-card" ng-if="!ctrl.state.loginInProgress">
          <form class="dc-auth-form" ng-submit="ctrl.authenticateUser()">
            <div class="dc-auth-oauth" ng-if="ctrl.state.showOAuthLogin">
              <a ng-href="{{ ctrl.OAuthLoginURI }}" class="dc-btn dc-btn-primary dc-auth-oauth-link" ng-if="ctrl.state.OAuthProvider === 'Microsoft'">
                <pr-icon icon="'svg-microsoft'"></pr-icon>
                Login with Microsoft
              </a>
              <a ng-href="{{ ctrl.OAuthLoginURI }}" class="dc-btn dc-btn-primary dc-auth-oauth-link" ng-if="ctrl.state.OAuthProvider === 'Google'">
                <pr-icon icon="'svg-google'"></pr-icon>
                Login with Google
              </a>
              <a ng-href="{{ ctrl.OAuthLoginURI }}" class="dc-btn dc-btn-primary dc-auth-oauth-link" ng-if="ctrl.state.OAuthProvider === 'Github'">
                <pr-icon icon="'svg-github'"></pr-icon>
                Login with GitHub
              </a>
              <a ng-href="{{ ctrl.OAuthLoginURI }}" class="dc-btn dc-btn-primary dc-auth-oauth-link" ng-if="ctrl.state.OAuthProvider === '1CRM'" data-cy="auth-sso-1crm">
                <pr-icon icon="'log-in'"></pr-icon>
                Sign in with 1CRM
              </a>
              <a ng-href="{{ ctrl.OAuthLoginURI }}" class="dc-btn dc-btn-primary dc-auth-oauth-link" ng-if="ctrl.state.OAuthProvider === 'OAuth'">
                <pr-icon icon="'log-in'"></pr-icon>
                Login with OAuth
              </a>
            </div>

            <div class="dc-auth-divider" ng-if="ctrl.state.showOAuthLogin">
              <span>or</span>
            </div>

            <button
              type="button"
              class="dc-btn dc-btn-secondary"
              ng-if="ctrl.state.showOAuthLogin && !ctrl.state.showStandardLogin"
              ng-click="ctrl.toggleStandardLogin()"
            >
              Use internal authentication
            </button>

            <div ng-if="ctrl.state.showStandardLogin" class="dc-auth-fields">
              <label class="dc-label" for="username">Username</label>
              <input
                id="username"
                type="text"
                data-cy="auth-usernameInput"
                class="dc-input"
                name="username"
                ng-model="ctrl.formValues.Username"
                auto-focus
                placeholder="Enter your username"
              />

              <label class="dc-label" for="password">Password</label>
              <div class="dc-password-wrap">
                <input
                  id="password"
                  ng-attr-type="{{ ctrl.state.passwordInputType }}"
                  class="dc-input dc-input-password"
                  name="password"
                  ng-model="ctrl.formValues.Password"
                  autocomplete="off"
                  data-cy="auth-passwordInput"
                  placeholder="Enter your password"
                  ng-trim="false"
                />
                <button
                  data-cy="auth-passwordInputToggle"
                  type="button"
                  ng-click="ctrl.toggleShowPassword()"
                  class="dc-password-toggle"
                  tooltip-append-to-body="true"
                  tooltip-placement="top"
                  tooltip-class="portainer-tooltip"
                  uib-tooltip="{{ ctrl.state.passwordInputType === 'password' ? 'Show password' : 'Hide password' }}"
                >
                  <pr-icon icon="ctrl.state.passwordInputType === 'password' ? 'eye-off' : 'eye'" size="'md'"></pr-icon>
                </button>
              </div>

              <button
                type="submit"
                class="dc-btn dc-btn-primary dc-btn-block"
                button-spinner="ctrl.state.loginInProgress"
                ng-disabled="ctrl.state.loginInProgress"
                data-cy="auth-loginButton"
              >
                <span ng-hide="ctrl.state.loginInProgress">Sign in</span>
                <span ng-show="ctrl.state.loginInProgress">Signing in…</span>
              </button>
            </div>
          </form>

          <div class="dc-auth-error" ng-if="ctrl.state.AuthenticationError">
            <pr-icon icon="'alert-triangle'" mode="'danger'"></pr-icon>
            <span>{{ ctrl.state.AuthenticationError }}</span>
          </div>
        </div>

        <div class="dc-auth-card dc-auth-progress" ng-show="ctrl.state.loginInProgress">
          <span>Authentication in progress… <span button-spinner="true"></span></span>
        </div>
      </div>
    </div>

    <!-- Right: brand plane (slate-800 + splash accent washes) -->
    <div class="dc-auth-hero" aria-hidden="true">
      <div class="dc-auth-hero-inner">
        <img
          class="dc-auth-hero-logo"
          src="~@/assets/images/logo/logo-text-on-dark.svg"
          width="256"
          height="80"
          alt=""
        />
        <div class="dc-auth-hero-title">Developer Console</div>
        <p class="dc-auth-hero-copy">Единый центр управления контейнерами и стеками.</p>
      </div>
    </div>
  </div>
</div>
